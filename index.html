<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camilla Tavares - Grupos Exclusivos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-container {
      position: relative;
      margin-bottom: 20px;
    }

    .avatar-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ff007a, #e6005c, #ff3300);
      box-shadow: 0 0 25px rgba(255, 0, 122, 0.5);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 15px;
      color: #e0e0e0;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .bio p {
      margin-bottom: 6px;
    }

    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.3s ease;
      position: relative;
    }

    /* Botão Ativo */
    .btn-active {
      background: linear-gradient(90deg, #ff007a 0%, #e6005c 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(255, 0, 122, 0.4);
      animation: pulse 2s infinite;
    }

    .btn-active:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 0, 122, 0.6);
    }

    /* Botão Trancado / Lotado */
    .btn-locked {
      background: #1a1a1a;
      color: #666666;
      border: 1px solid #333333;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .btn-active .btn-icon {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .btn-locked .btn-icon {
      background-color: #2a2a2a;
    }

    .status-tag {
      font-size: 10px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .tag-available {
      background-color: #ffffff;
      color: #e6005c;
    }

    .tag-full {
      background-color: #333333;
      color: #888888;
    }

    footer {
      font-size: 11px;
      color: #555555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 20px;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 0, 122, 0.6);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(255, 0, 122, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 0, 122, 0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar-container">
      <div class="avatar-ring">
        <img class="avatar-img" src="https://www.image2url.com/r2/default/files/1793148256084-43b60ee0-3020-4a59-8e38-9490acfaf04d.jpeg" alt="Camilla Tavares">
      </div>
    </div>

    <h1>Camilla Tavares</h1>

    <div class="bio">
      <p>Conteúdos diários e sem censura. Escolha um grupo disponível abaixo e venha me ver de perto 🫣💋</p>
    </div>

    <div class="buttons-container">
      <!-- GRUPO 1: TRANCADO -->
      <div class="btn btn-locked">
        <div class="btn-icon">🔒</div>
        <span>GRUPO 1 - LOTADO</span>
        <span class="status-tag tag-full">FECHADO</span>
      </div>

      
      <!-- GRUPO 2: DISPONÍVEL COM LINK CONFIGURADO -->
      <a href="https://t.me/CamillaTavares_bot" target="_blank" class="btn btn-active">
        <div class="btn-icon">✈️</div>
        <span>ENTRAR NO GRUPO 2 🔥</span>
        <span class="status-tag tag-available">7 VAGAS</span>
      </a>

      <!-- GRUPO 3: TRANCADO -->
      <div class="btn btn-locked">
        <div class="btn-icon">🔒</div>
        <span>GRUPO 3 - LOTADO</span>
        <span class="status-tag tag-full">FECHADO</span>
      </div>
    </div>
  </div>

  <footer>
    FEITO COM ♥ POR CAMILLA TAVARES
  </footer>

</body>
</html>
