<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Tavares | Linktree</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #f472b6;
            --accent-gradient: linear-gradient(135deg, #f472b6 0%, #db2777 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Fundo com efeito blur moderno */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.12) 0%, rgba(13, 15, 18, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* Perfil */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: var(--accent-gradient);
            box-shadow: 0 10px 30px rgba(244, 114, 182, 0.2);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a1d24;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 420px;
            white-space: pre-line;
        }

        /* Botão de Link / CTA Principal */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: var(--accent-gradient);
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.3);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(244, 114, 182, 0.4);
            filter: brightness(1.05);
        }

        .link-card:active {
            transform: translateY(0);
        }

        .link-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .link-icon {
            font-size: 1.3rem;
        }

        /* Rodapé Geral */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        footer a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Responsividade para telas menores */
        @media (max-width: 480px) {
            body {
                padding: 30px 16px;
            }
            .profile-name {
                font-size: 1.35rem;
            }
            .profile-bio {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Seção de Perfil -->
        <div class="profile-section">
            <div class="avatar-container">
                <img src="https://www.image2url.com/r2/default/images/1790508188713-e70d4fe8-93db-40a2-9b0a-4d4f068b5404.jpeg" alt="Camilla Tavares" class="avatar">
            </div>
            <h1 class="profile-name">Camilla Tavares</h1>
            <p class="profile-bio">Tudo que você precisa sobre mim está 👇🏼 
Amo pets 🐶🐱 
estudante de enfermagem e veterinária 🥼❤️
Crio conteúdo que você ama 🤭🫦</p>
        </div>

        <!-- Botão Único com CTA -->
        <div class="links-container">
            <a href="https://t.me/CamillaTavares_bot" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-telegram link-icon"></i>
                    <span>ACESSAR MEU CONTEÚDO EXCLUSIVO 🔥</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Rodapé -->
    <footer>
        Feito com 🤍 por <a href="#">Camilla Tavares</a>
    </footer>

</body>
</html>
